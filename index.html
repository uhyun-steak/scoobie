<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun Learning Academy 🍄 - Adventure Quiz World</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800;900&family=Jua&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --font-heading: 'Fredoka', 'Jua', cursive, sans-serif;
    --font-body: 'Nunito', 'Jua', sans-serif;
    --wood-dark: #4e2f12;
    --wood: #8b5a2b;
    --wood-light: #c68642;
    --cream: #fff3d6;
    --grass: #6fd33f;
    --grass-dark: #3d8f24;
    --dirt: #9a6a35;
  }

  body {
    font-family: var(--font-body);
    background: linear-gradient(180deg, #3aa8ff 0%, #86d2ff 55%, #cfeeff 100%);
    background-attachment: fixed;
    color: #4a2e12;
    overflow-x: hidden;
  }

  h1, h2, h3, .font-heading { font-family: var(--font-heading); }

  /* ---------- Animations ---------- */
  @keyframes floatSlow { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
  @keyframes floatIsland { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes floatCloud { 0% { transform: translateX(-10%); } 50% { transform: translateX(10%); } 100% { transform: translateX(-10%); } }
  @keyframes pulsePlay { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255,210,63,0)); } 50% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(255,210,63,.9)); } }
  @keyframes bounceCute { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px) scale(1.03); } }
  @keyframes earWiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
  @keyframes wobbleWrong { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px) rotate(-3deg); } 40%,80% { transform: translateX(8px) rotate(3deg); } }
  @keyframes popSuccess { 0% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes sparkle { 0%,100% { opacity: .2; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1.1) rotate(25deg); } }
  @keyframes noteRise { 0% { transform: translateY(0) rotate(-8deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-60px) rotate(10deg); opacity: 0; } }
  @keyframes levelUp { 0% { transform: translate(-50%, 20px) scale(.6); opacity: 0; } 20% { transform: translate(-50%, 0) scale(1.1); opacity: 1; } 80% { transform: translate(-50%, 0) scale(1); opacity: 1; } 100% { transform: translate(-50%, -30px) scale(1); opacity: 0; } }

  .anim-float { animation: floatSlow 4s ease-in-out infinite; }
  .anim-island { animation: floatIsland 5s ease-in-out infinite; }
  .anim-island-2 { animation: floatIsland 6.5s ease-in-out infinite reverse; }
  .anim-pulse-play { animation: pulsePlay 1.8s ease-in-out infinite; }
  .anim-cloud-left { animation: floatCloud 14s ease-in-out infinite; }
  .anim-cloud-right { animation: floatCloud 18s ease-in-out infinite reverse; }
  .anim-bounce { animation: bounceCute 2.5s ease-in-out infinite; }
  .anim-wiggle { animation: earWiggle 3s ease-in-out infinite; }
  .anim-wobble { animation: wobbleWrong 0.5s ease-in-out; }
  .anim-pop { animation: popSuccess 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .anim-sparkle { animation: sparkle 2.4s ease-in-out infinite; }
  .anim-note { animation: noteRise 3s ease-in infinite; }

  /* ---------- Title (thick outlined adventure lettering) ---------- */
  .title-3d {
    font-family: var(--font-heading);
    color: #ffd23f;
    -webkit-text-stroke: 7px #6b3410;
    paint-order: stroke fill;
    text-shadow: 0 6px 0 #6b3410, 0 12px 16px rgba(0,0,0,0.35);
    letter-spacing: 3px;
  }
  .title-3d-sub {
    font-family: var(--font-heading);
    color: #ff8a3d;
    -webkit-text-stroke: 7px #5a1f0a;
    paint-order: stroke fill;
    text-shadow: 0 6px 0 #5a1f0a, 0 12px 16px rgba(0,0,0,0.35);
    letter-spacing: 3px;
  }
  .brand-text {
    font-family: var(--font-heading);
    color: #fff3d6;
    -webkit-text-stroke: 4px #3a2008;
    paint-order: stroke fill;
    text-shadow: 0 3px 0 #3a2008;
  }

  /* ---------- Game-window style panels (class name kept: cloud-card) ---------- */
  .cloud-card {
    background: linear-gradient(180deg, #fffaf0 0%, #fff1cf 100%);
    border: 4px solid #6b4220;
    border-radius: 1.25rem;
    box-shadow:
      inset 0 0 0 3px #f6d58a,
      0 8px 0 rgba(60, 35, 10, 0.35),
      0 14px 24px rgba(0, 0, 0, 0.22);
  }

  /* ---------- Wooden header bar with grass fringe ---------- */
  .wood-bar {
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 70px),
      linear-gradient(180deg, #a06a32 0%, #8b5a2b 55%, #744a22 100%);
    border-bottom: 6px solid var(--wood-dark);
  }
  .wood-bar::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 100%;
    height: 16px;
    pointer-events: none;
    background:
      radial-gradient(circle at 10px 0, var(--grass) 9px, transparent 10px) 0 0 / 20px 16px repeat-x;
    filter: drop-shadow(0 3px 0 var(--grass-dark));
  }

  .nav-on  { background: linear-gradient(180deg,#ffa24a,#f2711c); color: #fff; border: 3px solid #ffd9a8; }
  .nav-off { background: linear-gradient(180deg,#fff7e2,#f6e2b6); color: #5b3a1a; border: 3px solid #c68642; }
  .nav-off:hover { background: #fff; }

  .coin-badge {
    background: linear-gradient(180deg,#3a2008,#2b1a0a);
    border: 3px solid #f6d58a;
    color: #ffd23f;
  }
  .exp-track {
    background: #2b1a0a;
    border: 2px solid #f6d58a;
    border-radius: 999px;
    overflow: hidden;
  }
  .exp-fill {
    height: 100%;
    background: linear-gradient(180deg, #d9ff7a 0%, #7be04a 55%, #3fae3a 100%);
    border-radius: 999px;
    transition: width .5s ease;
  }
  .exp-fill-quiz {
    height: 100%;
    background: linear-gradient(180deg, #ffe680 0%, #ffc233 55%, #f29a0a 100%);
    border-radius: 999px;
    transition: width .5s ease;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.5);
  }

  /* ---------- Grassy wooden quest cards ---------- */
  .game-card-box {
    position: relative;
    background: linear-gradient(180deg, #b27a3d 0%, #7d4f23 100%);
    border: 4px solid var(--wood-dark);
    border-radius: 1.1rem;
    padding: 0 0 6px;
    box-shadow: 0 9px 0 rgba(40, 22, 6, 0.45), 0 12px 18px rgba(0, 0, 0, 0.22);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: pointer;
  }
  .game-card-box::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 22px;
    background:
      radial-gradient(circle at 10px 16px, var(--grass-dark) 7px, transparent 8px) 0 0 / 20px 22px repeat-x,
      var(--grass);
    z-index: 2;
  }
  .game-card-box:hover { transform: translateY(-8px) scale(1.04); box-shadow: 0 17px 0 rgba(40, 22, 6, 0.4), 0 14px 24px rgba(0, 0, 0, 0.28); }
  .game-card-box:active { transform: translateY(2px) scale(0.98); box-shadow: 0 4px 0 rgba(40, 22, 6, 0.5); }

  .plank {
    background: linear-gradient(180deg, #fff7e2, #f3dcaa);
    border: 3px solid var(--wood-dark);
    border-radius: .7rem;
    color: #4a2e12;
  }

  /* ---------- Buttons ---------- */
  .btn-bubble {
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 0 rgba(40, 22, 6, 0.35);
  }
  .btn-bubble:hover:not(:disabled) { transform: translateY(-3px) scale(1.02); box-shadow: 0 9px 0 rgba(40, 22, 6, 0.3); }
  .btn-bubble:active:not(:disabled) { transform: translateY(2px) scale(0.98); box-shadow: 0 3px 0 rgba(40, 22, 6, 0.35); }

  .maple-answer {
    background: linear-gradient(180deg, #fffaf0, #f6e2b6);
    border: 4px solid #8b5a2b;
    color: #4a2e12;
  }
  .maple-answer:hover:not(:disabled) { background: #fff; border-color: #f2711c; }
  .maple-answer.is-correct {
    background: linear-gradient(180deg, #e6ffd0, #b8f08a);
    border-color: #3d8f24;
    color: #1f5d10;
  }

  .start-btn {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 1.8rem;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 3px 0 #7a2e06, 0 0 8px rgba(122,46,6,.6);
    background: linear-gradient(180deg, #ffc233 0%, #ff8a1f 55%, #e8620c 100%);
    border: 5px solid #fff1b8;
    outline: 5px solid #6b3410;
    border-radius: 1.4rem;
    padding: .8rem 2.4rem;
    box-shadow: 0 10px 0 #6b3410, 0 16px 24px rgba(0,0,0,.3);
    cursor: pointer;
    transition: transform .15s;
  }
  .start-btn:active { transform: translateY(4px) scale(.98); box-shadow: 0 4px 0 #6b3410; }

  /* ---------- Start-screen ground, fence ---------- */
  .ground {
    position: relative;
    height: 84px;
    background:
      radial-gradient(circle at 15px 54px, #7d4f23 4px, transparent 5px) 0 0 / 34px 34px,
      linear-gradient(180deg, #7be04a 0, #7be04a 14px, #3d8f24 14px, #3d8f24 22px, #a56f38 22px, #8a5a2b 100%);
    border-top: 4px solid #2f7a1a;
  }
  .fence {
    position: absolute;
    left: 0; right: 0;
    height: 46px;
    background:
      repeating-linear-gradient(90deg, #a56a2f 0 12px, transparent 12px 46px),
      linear-gradient(#b07a3f, #b07a3f) 0 12px / 100% 7px no-repeat,
      linear-gradient(#b07a3f, #b07a3f) 0 28px / 100% 7px no-repeat;
    filter: drop-shadow(0 2px 0 rgba(60,35,10,.5));
  }

  .levelup-banner {
    position: fixed;
    top: 110px; left: 50%;
    z-index: 100;
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 2rem;
    color: #ffd23f;
    -webkit-text-stroke: 6px #6b3410;
    paint-order: stroke fill;
    text-shadow: 0 5px 0 #6b3410;
    pointer-events: none;
    white-space: nowrap;
    animation: levelUp 2.2s ease forwards;
  }

  #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 99; }
</style>
</head>

<script>
/* ==========================================================================
   TRIAL DATABASE (IndexedDB, with localStorage fallback)
   --------------------------------------------------------------------------
   Every finished quiz is stored as one "trial" record, so progress can be
   tracked across many attempts instead of only the latest result.

   Store: "trials"  (keyPath: id, autoIncrement)
   Record shape:
     { id, player, subjectId, subjectName, attempt,   // attempt = Nth try of this
       correct, total, percent, perfect, stars,       //   subject by this player
       timestamp, answers: [{ q, chosen, right, ok }] }
   Indexes: player, subjectId, player_subject [player, subjectId], timestamp
   ========================================================================== */
const DB_NAME = 'fla-db';
const DB_VERSION = 1;
const TRIAL_STORE = 'trials';
const LS_TRIALS_KEY = 'fla-trials';
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB not supported')); return; }
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(TRIAL_STORE)) {
        const st = db.createObjectStore(TRIAL_STORE, { keyPath: 'id', autoIncrement: true });
        st.createIndex('player', 'player');
        st.createIndex('subjectId', 'subjectId');
        st.createIndex('player_subject', ['player', 'subjectId']);
        st.createIndex('timestamp', 'timestamp');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
  return dbPromise;
}

/* localStorage fallback (used only if IndexedDB is unavailable, e.g. some private modes) */
function lsReadTrials() {
  try { return JSON.parse(localStorage.getItem(LS_TRIALS_KEY) || '[]'); } catch (e) { return []; }
}
function lsWriteTrials(arr) {
  try { localStorage.setItem(LS_TRIALS_KEY, JSON.stringify(arr)); } catch (e) {}
}

async function dbAddTrial(trial) {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(TRIAL_STORE, 'readwrite');
      const st = tx.objectStore(TRIAL_STORE);
      const countReq = st.index('player_subject').count(IDBKeyRange.only([trial.player, trial.subjectId]));
      countReq.onsuccess = () => {
        trial.attempt = countReq.result + 1;
        st.add(trial);
      };
      tx.oncomplete = () => resolve(trial);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } catch (e) {
    const arr = lsReadTrials();
    trial.attempt = arr.filter(t => t.player === trial.player && t.subjectId === trial.subjectId).length + 1;
    trial.id = Date.now() + Math.random();
    arr.push(trial);
    lsWriteTrials(arr);
    return trial;
  }
}

async function dbGetAllTrials() {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(TRIAL_STORE, 'readonly').objectStore(TRIAL_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    return lsReadTrials();
  }
}

/* Delete one player's trials, or everything when player is null */
async function dbDeleteTrials(player) {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(TRIAL_STORE, 'readwrite');
      const st = tx.objectStore(TRIAL_STORE);
      if (player === null) {
        st.clear();
      } else {
        const cur = st.index('player').openCursor(IDBKeyRange.only(player));
        cur.onsuccess = () => {
          const c = cur.result;
          if (c) { c.delete(); c.continue(); }
        };
      }
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    const arr = lsReadTrials();
    lsWriteTrials(player === null ? [] : arr.filter(t => t.player !== player));
  }
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

/* Audio Synthesizer & Speech Setup */
let audioCtx = null;
let isAudioMuted = false;
let isVoiceMuted = false;
let bgmInterval = null;
let bgmStep = 0;
const synth = window.speechSynthesis;

/* App Data State */
let data = JSON.parse(localStorage.getItem('fla-data') || 'null') || { points: 0, completed: [], redeemed: [], playerName: 'Super Learner', unfinished: [] };
if (typeof data.earned !== 'number') data.earned = data.points || 0;   // lifetime stars, drives the level bar
let current = 'home';
let activeSubject = null;
let qIndex = 0;
let correct = 0;
let answered = false;
let trialAnswers = [];   // answers given during the quiz in progress (saved with the trial)

/* ---------- Level / EXP (lifetime stars earned; spending stars never lowers your level) ---------- */
const EXP_PER_LEVEL = 50;
function levelInfo() {
  const e = data.earned || 0;
  return { lvl: Math.floor(e / EXP_PER_LEVEL) + 1, exp: e % EXP_PER_LEVEL };
}
function addPoints(n) {
  const before = levelInfo().lvl;
  data.points += n;
  data.earned = (data.earned || 0) + n;
  if (levelInfo().lvl > before) showLevelUp(levelInfo().lvl);
}
function showLevelUp(lvl) {
  const el = document.createElement('div');
  el.className = 'levelup-banner';
  el.textContent = '⬆ LEVEL UP!  Lv.' + lvl;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2300);
  playFanfareSound();
}

/* High-Quality Friendly Voice Synthesis */
function speak(text) {
  if (isVoiceMuted || !('speechSynthesis' in window)) return;

  initAudio();
  window.speechSynthesis.cancel();

  setTimeout(() => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.volume = 1.0;
    utterance.pitch = 1.4; // Soft, upbeat, friendly child pitch
    utterance.rate = 0.85; // Clear, easy-to-understand speaking pace

    const voices = window.speechSynthesis.getVoices();
    if (voices && voices.length > 0) {
      const childVoice = voices.find(v => 
        v.lang.startsWith('en') && 
        (v.name.includes('Samantha') || v.name.includes('Victoria') || v.name.includes('Google US English') || v.name.includes('Karen') || v.name.includes('Female'))
      ) || voices.find(v => v.lang.startsWith('en'));

      if (childVoice) {
        utterance.voice = childVoice;
      }
    }

    window.speechSynthesis.speak(utterance);
  }, 60);
}

function stopSpeech() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

function toggleVoice() {
  isVoiceMuted = !isVoiceMuted;
  const icon = document.getElementById('voice-icon');
  const text = document.getElementById('voice-text');
  const btn = document.getElementById('voice-toggle-btn');
  
  if (isVoiceMuted) {
    stopSpeech();
    if (icon) icon.textContent = '🔇';
    if (text) text.textContent = 'Voice OFF';
    if (btn) btn.classList.replace('bg-sky-400', 'bg-gray-300');
  } else {
    if (icon) icon.textContent = '🔊';
    if (text) text.textContent = 'Voice ON';
    if (btn) btn.classList.replace('bg-gray-300', 'bg-sky-400');
    speak("Hello there! Voice narration is on!");
  }
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

/* Gentle Melodic Background Music Chimes */
const bgmNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 440.00, 349.23, 392.00, 523.25, 659.25, 523.25];
function startBGM() {
  if (bgmInterval || isAudioMuted) return;
  bgmInterval = setInterval(() => {
    if (isAudioMuted || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = bgmNotes[bgmStep % bgmNotes.length];
      gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0005, audioCtx.currentTime + 0.7);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.75);
      bgmStep++;
    } catch(e){}
  }, 800);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

function toggleAudio() {
  initAudio();
  isAudioMuted = !isAudioMuted;
  const icon = document.getElementById('audio-icon');
  const text = document.getElementById('audio-text');
  const btn = document.getElementById('audio-toggle-btn');
  const startIcon = document.getElementById('start-audio-icon');
  
  if (isAudioMuted) {
    stopBGM();
    if (icon) icon.textContent = '🔇';
    if (text) text.textContent = 'Music OFF';
    if (btn) btn.classList.replace('bg-amber-400', 'bg-gray-300');
    if (startIcon) startIcon.textContent = '🔇';
  } else {
    startBGM();
    if (icon) icon.textContent = '🎵';
    if (text) text.textContent = 'Music ON';
    if (btn) btn.classList.replace('bg-gray-300', 'bg-amber-400');
    if (startIcon) startIcon.textContent = '🎵';
    playClickSound();
  }
}

/* Warm & Friendly Sound Effects */
function playClickSound() {
  if (isAudioMuted) return;
  initAudio();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.09);
  } catch(e){}
}

function playCorrectSound() {
  if (isAudioMuted) return;
  initAudio();
  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((freq, idx) => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const startTime = audioCtx.currentTime + (idx * 0.08);
      gain.gain.setValueAtTime(0.1, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.28);
    } catch(e){}
  });
}

function playWrongSound() {
  if (isAudioMuted) return;
  initAudio();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(330, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(261.63, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.23);
  } catch(e){}
}

function playFanfareSound() {
  if (isAudioMuted) return;
  initAudio();
  const arpeggio = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50, 1318.51];
  arpeggio.forEach((freq, idx) => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const startTime = audioCtx.currentTime + (idx * 0.09);
      gain.gain.setValueAtTime(0.12, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.32);
    } catch(e){}
  });
}

function playCoinsSound() {
  if (isAudioMuted) return;
  initAudio();
  try {
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = 'sine';
    osc2.type = 'sine';
    osc1.frequency.setValueAtTime(987.77, audioCtx.currentTime);
    osc2.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.07);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start();
    osc2.start(audioCtx.currentTime + 0.07);
    osc1.stop(audioCtx.currentTime + 0.26);
    osc2.stop(audioCtx.currentTime + 0.28);
  } catch(e){}
}

/* Canvas Confetti */
const confettiCanvas = document.getElementById('confetti-canvas');
const ctx = confettiCanvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function launchConfetti() {
  particles = [];
  const colors = ['#f472b6', '#38bdf8', '#fbbf24', '#34d399', '#a78bfa', '#fb7185'];
  for (let i = 0; i < 90; i++) {
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2 - 50,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.7) * 14,
      size: Math.random() * 9 + 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rSpeed: (Math.random() - 0.5) * 10
    });
  }
  requestAnimationFrame(updateConfetti);
}

function updateConfetti() {
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  let alive = false;
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.35;
    p.rotation += p.rSpeed;
    if (p.y < confettiCanvas.height) alive = true;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  });
  if (alive) requestAnimationFrame(updateConfetti);
}

function shuffle(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

  // Record this answer for the trial being played
  trialAnswers.push({ q: q[0], chosen: answer, right: q[1], ok });

  document.querySelectorAll('.answer-btn').forEach(b => {

function finishHTML(s) {
  let perfect = correct === s.questions.length;
  let bonus = perfect ? 20 : 0;
  
  if (!window.finishHandled) {
    if (perfect) {
      if (!data.completed.includes(s.id)) data.completed.push(s.id);
      if (data.unfinished) data.unfinished = data.unfinished.filter(id => id !== s.id);
      addPoints(10 + bonus);
    } else {
      if (!data.unfinished) data.unfinished = [];
      if (!data.unfinished.includes(s.id)) data.unfinished.push(s.id);
      data.completed = data.completed.filter(id => id !== s.id);
    }
    
    window.finishHandled = true;
    save();

    // Save this trial to the database
    const total = s.questions.length;
    dbAddTrial({
      player: data.playerName || 'Super Learner',
      subjectId: s.id,
      subjectName: s.name,
      correct,
      total,
      percent: Math.round((correct / total) * 100),
      perfect,
      stars: correct * 5 + (perfect ? 10 + bonus : 0),
      timestamp: Date.now(),
      answers: trialAnswers.slice()
    }).then(t => {
      const el = document.getElementById('trial-note');
      if (el) el.textContent = `📝 Trial #${t.attempt} saved to your progress record`;

/* Fill the Trial History section from the database */
async function loadTrialHistory() {
  const box = document.getElementById('trial-history');
  const sel = document.getElementById('history-player');
  if (!box || !sel) return;

  const all = await dbGetAllTrials();

  // Player dropdown: everyone with trials, plus the current player
  const prev = sel.value || data.playerName || 'Super Learner';
  const players = Array.from(new Set([data.playerName || 'Super Learner', ...all.map(t => t.player)]));
  sel.innerHTML = players.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  sel.value = players.includes(prev) ? prev : players[0];
  const player = sel.value;

  const mine = all.filter(t => t.player === player).sort((a, b) => a.timestamp - b.timestamp);
  if (!mine.length) {
    box.innerHTML = `<p class="text-amber-600 font-bold">No trials recorded for <span class="font-black">${esc(player)}</span> yet. Finish a quiz to start the record!</p>`;
    return;
  }

  const perfectCount = mine.filter(t => t.perfect).length;
  const overallAvg = Math.round(mine.reduce((n, t) => n + t.percent, 0) / mine.length);

  const perSubject = subjects.map(s => {
    const trials = mine.filter(t => t.subjectId === s.id);
    if (!trials.length) return '';
    const best = Math.max(...trials.map(t => t.percent));
    const last = trials[trials.length - 1].percent;
    const first = trials[0].percent;
    const avg = Math.round(trials.reduce((n, t) => n + t.percent, 0) / trials.length);
    const delta = last - first;
    const trend = trials.length < 2 ? '' :
      delta > 0 ? `<span class="text-emerald-600">▲ +${delta}% since first try</span>` :
      delta < 0 ? `<span class="text-rose-500">▼ ${delta}% since first try</span>` :
      `<span class="text-amber-400">● same as first try</span>`;
    const bars = trials.slice(-10).map(t => `
      <div title="Trial #${t.attempt}: ${t.correct}/${t.total}" class="w-3 rounded-t-sm ${t.perfect ? 'bg-emerald-400' : 'bg-amber-400'}" style="height:${Math.max(4, Math.round(t.percent * 0.36))}px"></div>
    `).join('');
    return `
      <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 flex flex-wrap items-end justify-between gap-3">
        <div class="space-y-0.5">
          <div class="font-black text-amber-950 text-base">${s.emoji} ${s.name}</div>
          <div class="text-xs font-bold text-amber-800">${trials.length} trial${trials.length > 1 ? 's' : ''} · best ${best}% · avg ${avg}% · latest ${last}%</div>
          <div class="text-xs font-black">${trend}</div>
        </div>
        <div class="flex items-end gap-1 h-9" aria-label="Last scores">${bars}</div>
      </div>
    `;
  }).join('');

  const recent = mine.slice(-10).reverse().map(t => `
    <tr class="border-t border-amber-200">
      <td class="py-1.5 pr-3 whitespace-nowrap">${new Date(t.timestamp).toLocaleString()}</td>
      <td class="py-1.5 pr-3 font-black text-amber-950">${esc(t.subjectName)}</td>
      <td class="py-1.5 pr-3 text-center">#${t.attempt}</td>
      <td class="py-1.5 pr-3 text-center font-black ${t.perfect ? 'text-emerald-600' : 'text-amber-600'}">${t.correct}/${t.total} (${t.percent}%)</td>
      <td class="py-1.5 text-right">⭐ ${t.stars}</td>
    </tr>
  `).join('');

  box.innerHTML = `
    <div class="grid grid-cols-3 gap-3 text-center">
      <div class="bg-sky-50 border-2 border-sky-200 rounded-2xl p-3"><div class="text-xs font-bold text-sky-700 uppercase">Trials</div><div class="text-2xl font-black text-sky-900">${mine.length}</div></div>
      <div class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-3"><div class="text-xs font-bold text-emerald-700 uppercase">Perfect</div><div class="text-2xl font-black text-emerald-800">${perfectCount}</div></div>
      <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3"><div class="text-xs font-bold text-amber-700 uppercase">Avg Score</div><div class="text-2xl font-black text-amber-800">${overallAvg}%</div></div>
    </div>
    <div class="space-y-3 mt-4">${perSubject}</div>
    <h3 class="font-black text-amber-900 mt-5 mb-2">Recent Trials</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-xs sm:text-sm font-bold text-amber-800">
        <thead><tr class="text-left text-amber-500 uppercase text-xs"><th class="pb-1">When</th><th class="pb-1">Subject</th><th class="pb-1 text-center">Try</th><th class="pb-1 text-center">Score</th><th class="pb-1 text-right">Stars</th></tr></thead>
        <tbody>${recent}</tbody>
      </table>
    </div>
  `;
}
window.loadTrialHistory = loadTrialHistory;

/* Export every recorded trial (all players) as a CSV file */
async function exportTrialsCSV() {
  playClickSound();
  const all = await dbGetAllTrials();
  if (!all.length) {
    showModal('Nothing to export', 'Finish a quiz first and your trials will be saved here.', '📝');
    return;
  }
  const cell = v => '"' + String(v).replace(/"/g, '""') + '"';
  const header = ['Player', 'Subject', 'Attempt', 'Correct', 'Total', 'Percent', 'Perfect', 'Stars', 'Date'];
  const rows = all.sort((a, b) => a.timestamp - b.timestamp).map(t => [
    t.player, t.subjectName, t.attempt, t.correct, t.total, t.percent, t.perfect ? 'yes' : 'no', t.stars, new Date(t.timestamp).toISOString()
  ].map(cell).join(','));
  const blob = new Blob([[header.map(cell).join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fun-learning-trials.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
window.exportTrialsCSV = exportTrialsCSV;

function redeem(id) {
  let p = prizes.find(x => x.id === id);
  if (data.points < p.cost) {
    playWrongSound();
    showModal('Need More Stars!', 'Complete more activities and quizzes to earn enough stars for this prize!', '⭐');
    return;
  }

  showModal(
    'Redeem Prize?',
    `Would you like to spend ${p.cost} stars to unlock the ${p.name}?`,
    p.emoji,
    () => {
      data.points -= p.cost;
      data.redeemed.push({
        id: p.id,
        name: p.name,
        emoji: p.emoji,
        cost: p.cost,
        date: new Date().toLocaleDateString()
      });
      save();
      launchConfetti();
      playCoinsSound();
      playFanfareSound();
      render();
      showModal('Reward Redeemed! 🎉', `You unlocked the ${p.name}! Check it out in your Rewards Shelf.`, p.emoji);
