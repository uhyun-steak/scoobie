<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker test</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 460px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  input, button { font: inherit; padding: 8px 12px; margin: 4px 4px 4px 0; }
  #status { font-size: 14px; color: #666; }
  #stars { font-weight: 700; }
</style>
</head>
<body>
  <h1>Tracker test page</h1>
  <p id="status">Connecting...</p>

  <p>
    <input id="name" placeholder="Child's name" maxlength="40">
    <button id="saveName">Save name</button>
  </p>
  <p>Stars: <span id="stars">0</span></p>
  <p>
    <button id="star">Earn a star</button>
    <button id="level">Finish a level</button>
  </p>
  <p style="font-size:14px;color:#666">
    Press the buttons, then open <code>admin/index.html</code>. The player should appear there.
    Replace this page with your real games: they only need the two script tags and the calls used below.
  </p>

  <script src="firebase-config.js"></script>
  <script src="tracker.js"></script>
  <script>
    var level = 0;
    var p = GameTracker.getPlayer();
    document.getElementById('name').value = p.name;
    document.getElementById('stars').textContent = p.stars;
    if (p.progress.demo && p.progress.demo.level) level = p.progress.demo.level;

    GameTracker.onStatus(function (s) {
      var text = {
        'connecting': 'Connecting to the database...',
        'online': 'Connected: data is being recorded.',
        'local-only': 'Firebase is not set up yet: saving on this device only.',
        'error': 'Could not reach the database: saving on this device only.'
      };
      document.getElementById('status').textContent = text[s] || s;
    });

    document.getElementById('saveName').onclick = function () {
      GameTracker.setPlayer(document.getElementById('name').value);
    };
    document.getElementById('star').onclick = function () {
      document.getElementById('stars').textContent = GameTracker.addStars(1, 'demo');
    };
    document.getElementById('level').onclick = function () {
      level += 1;
      GameTracker.saveProgress('demo', { level: level });
      GameTracker.logEvent('demo', 'level-complete', { level: level });
    };
  </script>
</body>
</html>
